<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home and Reader prototype – feed reader</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
/* MOTION TOKENS
   press .18s spring | content enter .35s ease-out, 40ms stagger | feed swap .13s out then .35s in
   chip pill + tab bar .3s ease-out | shared element (card to Reader) .5s ease-out, crop animates
   swipe threshold 90px, spring back .35s | pull to refresh threshold 70px | reduced motion: all off */
:root{--bg:#EEEAE1;--ink:#141413;--mute:#6B665C;--line:rgba(20,20,19,.16);--card:#D6CFBF;--acc:#E4472B;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
@media (prefers-color-scheme:dark){:root{--bg:#10100F;--ink:#F1EDE4;--mute:#9C978B;--line:rgba(241,237,228,.18);--card:#242320}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{overscroll-behavior-y:contain}
body{background:var(--bg);color:var(--ink);font-family:"Archivo","Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;transition:transform .18s var(--spring),background-color .2s,color .2s}
button:not(:disabled):active{transform:scale(.96)}
.app{max-width:430px;min-height:100vh;margin:0 auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
main{flex:1}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
header button{min-width:28px;height:28px;display:grid;place-items:center}
.menu{display:grid;gap:6px;width:22px}.menu i{display:block;height:1.5px;background:var(--ink)}
.logo{font-weight:800;font-stretch:125%;font-size:16px;letter-spacing:.01em}
.glass{position:relative;width:16px;height:16px;border:1.5px solid var(--ink);border-radius:50%}
.glass::after{content:"";position:absolute;width:7px;height:1.5px;background:var(--ink);right:-6px;bottom:-2px;transform:rotate(45deg)}
.ptr{height:2px}#ptrbar{display:block;height:2px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}
#ptrbar.spin{animation:spin .7s linear infinite}
@keyframes spin{0%{transform:scaleX(.1);transform-origin:left}50%{transform:scaleX(1);transform-origin:left}50.01%{transform-origin:right}100%{transform:scaleX(.1);transform-origin:right}}
.out{opacity:0;transform:translateY(6px);transition:opacity .13s,transform .13s}
.chips{position:relative;display:flex;gap:8px;overflow-x:auto;padding:16px 20px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.ind{position:absolute;background:var(--ink);border-radius:999px;transition:left .3s var(--ease),width .3s var(--ease)}
.chip{position:relative;z-index:1;flex:none;border:1px solid var(--ink);color:var(--ink);font-size:13px;padding:8px 16px;border-radius:999px}
.chip.on{color:var(--bg)}
.hero{margin:8px 20px 20px}
.hero.slide{animation:slideIn .45s var(--ease) backwards}
@keyframes slideIn{from{opacity:0;transform:translateX(28px)}}
.pic,.thumb,.r-pic{position:relative;background:var(--card) center 30%/cover no-repeat}
.pic{aspect-ratio:4/5;border-radius:26px;overflow:hidden;transition:transform .25s var(--spring)}
.hero:active .pic{transform:scale(.97)}
.pic.flat{aspect-ratio:1;display:flex;align-items:flex-end;padding:22px}
.pic.flat h2{margin:0 56px 0 0}
.go{position:absolute;right:14px;bottom:14px;width:46px;height:46px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:22px;transition:transform .25s var(--spring)}
.hero:active .go{transform:translate(3px,-3px)}
h2{font-size:34px;line-height:.98;text-transform:uppercase;font-weight:800;font-stretch:112%;letter-spacing:-.02em;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.hero > h2{margin:18px 0 12px}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}
.w>span{display:inline-block;animation:wr .6s var(--ease) backwards;animation-delay:calc(var(--i)*35ms + 120ms)}
@keyframes wr{from{transform:translateY(105%)}}
.meta{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--mute)}
.meta b{font-weight:500;color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:none;transition:transform .25s var(--spring),width .25s,margin .25s}
.read .dot{transform:scale(0);width:0;margin-right:-14px}
.is-saved .meta::after{content:"Saved";color:var(--ink)}
.hero.read h2{opacity:.45}.hero h2{transition:opacity .35s}
.row{position:relative;overflow:hidden;border-top:1px solid var(--line)}
.under{position:absolute;inset:0;display:flex;align-items:center;gap:10px;padding-left:22px;font-size:14px;font-weight:500;background:var(--card);transition:background-color .15s,color .15s}
.under svg{width:20px;height:20px}.under path{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;transition:fill .15s}
.row.armed .under{background:var(--ink);color:var(--bg)}
.row.armed .under path{fill:currentColor}
.row.armed .under svg{animation:pop .4s var(--spring)}
.fg{position:relative;display:grid;grid-template-columns:1fr 88px;gap:16px;padding:18px 20px;background:var(--bg);touch-action:pan-y;transition:transform .35s var(--spring);will-change:transform}
.row.noimg .fg{grid-template-columns:1fr}
.fg>*{transition:opacity .35s}.row.read .fg>*{opacity:.45}
.row h3{font-size:18px;line-height:1.14;font-weight:700;letter-spacing:-.01em;margin-top:10px}
.thumb{width:88px;height:88px;border-radius:14px;transition:transform .25s var(--spring)}
.row:active .thumb{transform:scale(.94)}
.in{animation:rise .35s var(--ease) backwards;animation-delay:calc(var(--i,0)*40ms)}
.drop{animation:dropIn .4s var(--ease) backwards;animation-delay:calc(var(--i,0)*40ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes dropIn{from{opacity:0;transform:translateY(-18px)}}
@keyframes pop{0%{transform:scale(.6)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.pt{font-size:40px;line-height:.96;text-transform:uppercase;font-weight:800;font-stretch:112%;letter-spacing:-.02em;padding:26px 20px 18px}
.empty{padding:20px;font-size:15px;line-height:1.4;color:var(--mute);max-width:30ch}
.src{display:flex;align-items:center;gap:16px;padding:16px 20px;border-top:1px solid var(--line)}
.mono{flex:none;width:48px;height:48px;border-radius:14px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-stretch:125%;font-size:15px}
.src b{display:block;font-size:18px;font-weight:700;margin-bottom:5px}.src span{font-size:13px;color:var(--mute)}
nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav a{padding:16px 0 18px;text-align:center;font-size:13px;color:var(--mute);cursor:pointer;transition:color .2s,transform .18s var(--spring)}
nav a:active{transform:scale(.94)}nav a.on{color:var(--ink);font-weight:500}
.tind{position:absolute;top:-1px;height:2px;background:var(--ink);transition:left .3s var(--ease),width .3s var(--ease)}
#toast{position:fixed;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;z-index:40;pointer-events:none;transition:transform .3s var(--spring),opacity .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* Reader overlay */
#reader{position:fixed;top:0;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;z-index:30;background:var(--bg);overflow-y:auto;opacity:0;transition:opacity .25s var(--ease);display:flex;flex-direction:column}
#reader.open{opacity:1}
.pgw{position:sticky;top:0;height:0;z-index:8}#prog{display:block;height:2px;background:var(--ink);width:0}
.rh{position:sticky;top:0;z-index:7;background:var(--bg);padding:14px 20px;border-bottom:1px solid var(--line);transition:transform .28s var(--ease);display:block}
.rh.hide{transform:translateY(-100%)}
.back{display:block;width:12px;height:12px;margin:8px 0 8px 6px;border-left:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:rotate(45deg)}
.rbody{flex:1;padding:20px 20px 40px}
.r-pic{aspect-ratio:1;border-radius:26px}
.fly{position:fixed;z-index:60;background-size:cover;background-position:center 30%;pointer-events:none;transition:left .5s var(--ease),top .5s var(--ease),width .5s var(--ease),height .5s var(--ease),border-radius .5s var(--ease)}
#rtitle{font-size:32px;line-height:1;text-transform:uppercase;font-weight:800;font-stretch:112%;letter-spacing:-.02em;margin:22px 0}
#rtitle.in{animation:titleUp .5s var(--ease) backwards;animation-delay:.12s}
@keyframes titleUp{from{opacity:0;transform:translateY(40px)}}
#rdl{border-top:1px solid var(--line)}#rdl div{display:grid;grid-template-columns:104px 1fr;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}#rdl dt{color:var(--mute)}
#rtext{margin-top:26px}#rtext p{font-size:18px;line-height:1.6;margin-bottom:1.1em}
#reader.closing .rbody,#reader.closing .rh,#reader.closing .rf{opacity:0;transition:opacity .15s}
.rf{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.rf button,.rf a{display:flex;align-items:center;justify-content:center;gap:8px;padding:17px 0 19px;font-size:13px;color:var(--mute);text-decoration:none}
.rf .on{color:var(--ink);font-weight:500}.rf svg{width:16px;height:16px}.rf path{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;transition:fill .2s}
.rf .on path{fill:currentColor}.rf .bump svg{animation:pop .45s var(--spring)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
<header>
  <button aria-label="Menu"><span class="menu"><i></i><i></i><i></i></span></button>
  <button class="logo" id="logo" aria-label="Refresh feed">Signal</button>
  <button aria-label="Search"><span class="glass"></span></button>
</header>
<div class="ptr"><i id="ptrbar"></i></div>
<main>
  <section id="v-home">
    <div class="chips" id="chips"></div>
    <div id="feed"><article class="hero" id="hero"></article><section id="list"></section></div>
  </section>
  <section id="v-saved" hidden></section>
  <section id="v-sources" hidden></section>
</main>
<nav id="nav"><a class="on" data-v="home">Home</a><a data-v="saved">Saved</a><a data-v="sources">Sources</a><i class="tind" id="tind"></i></nav>
</div>
<div id="toast"></div>
<div id="reader" hidden>
  <div class="pgw"><i id="prog"></i></div>
  <header class="rh"><button class="back" id="back" aria-label="Back"></button></header>
  <div class="rbody"><div class="r-pic" id="rpic"></div><h1 id="rtitle"></h1><dl id="rdl"></dl><div id="rtext"></div></div>
  <footer class="rf">
    <button id="rsave"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span>Save</span></button>
    <a href="#">Open site ↗</a>
  </footer>
</div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const tick=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};
const BODY="<p>For most of the last decade, the studio light was the default. A softbox, a flash, a controlled room. A growing group of photographers is walking away from all of it.</p><p>They shoot at the edge of the day, in forests, ponds and half-lit rooms, and they accept whatever the weather gives them. The results are darker, grainier and strangely calm.</p><p>Working without strobes means working slowly. Sessions are planned around the sun rather than the schedule, and a missed hour can mean a missed week.</p>";
let POSTS=[
  {src:"Creative Review",ago:"12 min ago",title:"The photographers who shoot only in natural light",img:"water"},
  {src:"WALLPAPER*",ago:"38 min ago",title:"Fangs, gloss and the new gothic beauty",img:"fang"},
  {src:"Creative Boom",ago:"1 hr ago",title:"A patchwork bear that’s part toy, part nightmare",img:"bear"},
  {src:"Dezeen",ago:"2 hr ago",title:"A timber pavilion designed to be taken apart"},
  {src:"WIRED",ago:"3 hr ago",title:"Why every new app is quietly copying the same layout"},
  {src:"Creative Boom",ago:"5 hr ago",title:"Chunky outlines and sticker colours: the new game-character look",img:"dino",read:true},
  {src:"WIRED",ago:"Yesterday",title:"The indie game that turned a pumpkin into a hero",img:"pumpkin",read:true}
].map((p,i)=>({...p,id:i}));
let nextId=100;
const QUEUE=[{src:"Creative Boom",title:"Studio visits: inside a ceramicist’s tiny workshop"},{src:"Dezeen",title:"The housing project that grows with its residents"}];
const SOURCES=["All","WIRED","Creative Boom","WALLPAPER*","Creative Review","Dezeen"];
let filter="All", view="home", cur=null, tok=0, ft=0;
const BM='<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';

/* ---------- rendering ---------- */
const meta=p=>`<div class="meta"><span class="dot"></span><b>${p.src}</b><span>${p.ago}</span></div>`;
const ttl=(t,w)=>w?t.split(" ").map((x,i)=>`<span class="w"><span style="--i:${i}">${x}</span></span>`).join(" "):t;
const heroHTML=(h,w)=>(h.img?`<div class="pic" style="background-image:var(--img-${h.img})"><span class="go">↗</span></div><h2>${ttl(h.title,w)}</h2>`:`<div class="pic flat"><h2>${ttl(h.title,w)}</h2><span class="go">↗</span></div>`)+meta(h);
const rowHTML=p=>`<article class="row${p.img?"":" noimg"}${p.read?" read":""}${p.saved?" is-saved":""}" data-id="${p.id}"><div class="under">${BM}<span>Save</span></div><div class="fg"><div>${meta(p)}<h3>${p.title}</h3></div>${p.img?`<div class="thumb" style="background-image:var(--img-${p.img})"></div>`:""}</div></article>`;
function stag(sel,cls="in"){$$(sel).forEach((e,i)=>{e.style.setProperty("--i",Math.min(i,10));e.classList.remove("in","drop");void e.offsetWidth;e.classList.add(cls)})}
function renderFeed(o={}){
  const set=POSTS.filter(p=>filter==="All"||p.src===filter);
  // Hero rule: newest article with an image from the active chip, else the newest as a flat type card.
  const h=set.find(p=>p.img)||set[0], rest=set.filter(p=>p!==h), he=$("#hero");
  he.hidden=!h;
  if(h){he.dataset.id=h.id;he.className="hero"+(h.read?" read":"")+(h.saved?" is-saved":"")+(o.slide?" slide":"");he.innerHTML=heroHTML(h,o.words)}
  $("#list").innerHTML=rest.map(rowHTML).join("");
  if(o.drop){let k=0;$$("#list .row").forEach(r=>{if(o.drop.has(+r.dataset.id)){r.style.setProperty("--i",k++);r.classList.add("drop")}})}
  else stag("#list .row");
}
function renderView(v){
  if(v==="home") renderFeed({});
  if(v==="saved"){const s=POSTS.filter(p=>p.saved);$("#v-saved").innerHTML='<h1 class="pt">Saved</h1>'+(s.length?s.map(rowHTML).join(""):'<p class="empty">Nothing saved yet. Swipe a row to the right to save it.</p>');stag("#v-saved .row,#v-saved .empty")}
  if(v==="sources"){$("#v-sources").innerHTML='<h1 class="pt">Sources</h1>'+SOURCES.slice(1).map(s=>{const u=POSTS.filter(p=>p.src===s&&!p.read).length;return `<div class="src"><div class="mono">${s.replace(/[^A-Za-z*]/g,"").slice(0,2).toUpperCase()}</div><div><b>${s}</b><span>${u?u+" unread":"All read"}</span></div></div>`}).join("");stag("#v-sources .src")}
}

/* ---------- chips: sliding pill + feed swap ---------- */
$("#chips").innerHTML='<i class="ind" id="ind"></i>'+SOURCES.map((s,i)=>`<button class="chip${i?"":" on"}">${s}</button>`).join("");
const moveInd=c=>{const i=$("#ind");i.style.left=c.offsetLeft+"px";i.style.top=c.offsetTop+"px";i.style.width=c.offsetWidth+"px";i.style.height=c.offsetHeight+"px"};
$("#chips").addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c||c.textContent===filter) return;
  $$(".chip").forEach(x=>x.classList.toggle("on",x===c)); filter=c.textContent; moveInd(c);
  c.scrollIntoView({inline:"center",behavior:"smooth",block:"nearest"});
  const t=++ft; $("#feed").classList.add("out");
  setTimeout(()=>{if(t!==ft)return;renderFeed({slide:true});$("#feed").classList.remove("out")},130);
});

/* ---------- tabs ---------- */
const moveTind=a=>{const t=$("#tind");t.style.left=a.offsetLeft+a.offsetWidth*.34+"px";t.style.width=a.offsetWidth*.32+"px"};
$("#nav").addEventListener("click",e=>{
  const a=e.target.closest("a"); if(!a||a.dataset.v===view) return;
  view=a.dataset.v; $$("#nav a").forEach(x=>x.classList.toggle("on",x===a)); moveTind(a);
  const from=$$("main > section").find(s=>!s.hidden); from.classList.add("out");
  setTimeout(()=>{from.hidden=true;from.classList.remove("out");$("#v-"+view).hidden=false;renderView(view)},130);
});

/* ---------- swipe to save ---------- */
let sw=null, sup=false;
document.addEventListener("pointerdown",e=>{
  const fg=e.target.closest(".row .fg"); if(!fg||e.button>0) return;
  const row=fg.parentElement, p=POSTS.find(x=>x.id==row.dataset.id);
  sw={fg,row,p,x:e.clientX,dx:0,armed:false,drag:false};
  row.querySelector(".under span").textContent=p.saved?"Unsave":"Save";
});
document.addEventListener("pointermove",e=>{
  if(!sw) return; const dx=e.clientX-sw.x; if(Math.abs(dx)<6&&!sw.drag) return;
  sw.drag=true; sw.fg.style.transition="none"; sw.dx=Math.max(0,dx);
  sw.fg.style.transform=`translateX(${sw.dx<110?sw.dx:110+(sw.dx-110)*.3}px)`;
  const arm=sw.dx>=90; if(arm!==sw.armed){sw.armed=arm;sw.row.classList.toggle("armed",arm);if(arm)tick()}
});
function endSwipe(){
  if(!sw) return; const s=sw; sw=null; s.fg.style.transition=""; s.fg.style.transform="";
  if(s.drag){sup=true;setTimeout(()=>sup=false,80)}
  if(s.armed){s.p.saved=!s.p.saved;$$(`[data-id="${s.p.id}"]`).forEach(el=>el.classList.toggle("is-saved",s.p.saved))}
  setTimeout(()=>s.row.classList.remove("armed"),260);
}
["pointerup","pointercancel"].forEach(t=>document.addEventListener(t,endSwipe));

/* ---------- pull to refresh (touch) ---------- */
let y0=null, pull=0, armedP=false;
document.addEventListener("touchstart",e=>{y0=(view==="home"&&scrollY<=0&&$("#reader").hidden)?e.touches[0].clientY:null;pull=0;armedP=false},{passive:true});
document.addEventListener("touchmove",e=>{
  if(y0==null) return; const dy=e.touches[0].clientY-y0; if(dy<=0) return;
  pull=Math.min(dy*.5,90); const b=$("#ptrbar"); b.style.transition="none"; b.style.transform=`scaleX(${pull/70})`;
  if(pull>=70&&!armedP){armedP=true;tick()} if(e.cancelable) e.preventDefault();
},{passive:false});
document.addEventListener("touchend",()=>{
  if(y0==null) return; y0=null; const b=$("#ptrbar"); b.style.transition="";
  if(armedP) refresh(); else b.style.transform="scaleX(0)";
});
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}
function refresh(){
  const b=$("#ptrbar"); b.style.transform=""; b.classList.add("spin");
  setTimeout(()=>{
    b.classList.remove("spin"); b.style.transform="scaleX(0)";
    const add=QUEUE.splice(0,2); if(!add.length){toast("You’re up to date");return}
    const ids=new Set(); add.reverse().forEach(a=>{const p={...a,ago:"Just now",id:nextId++};ids.add(p.id);POSTS.unshift(p)});
    renderFeed({drop:ids}); toast(`${add.length} new articles`);
  },700);
}
$("#logo").onclick=()=>{if(view==="home"&&$("#reader").hidden)refresh()};

/* ---------- Reader: shared-element transition ---------- */
const R=$("#reader"), rpic=$("#rpic"), rect=el=>el.getBoundingClientRect();
let curFly=null;
function flyTo(from,to,r0,r1){
  if(curFly){curFly.remove();curFly=null}
  const a=rect(from), b=rect(to), f=document.createElement("div"); f.className="fly";
  Object.assign(f.style,{left:a.left+"px",top:a.top+"px",width:a.width+"px",height:a.height+"px",borderRadius:r0+"px",backgroundImage:getComputedStyle(from).backgroundImage});
  document.body.appendChild(f); curFly=f; from.style.visibility="hidden"; to.style.visibility="hidden";
  // The box changes shape while the image stays cover-cropped, so the crop animates from 4:5 to 1:1.
  requestAnimationFrame(()=>requestAnimationFrame(()=>Object.assign(f.style,{left:b.left+"px",top:b.top+"px",width:b.width+"px",height:b.height+"px",borderRadius:r1+"px"})));
  setTimeout(()=>{if(curFly===f){f.remove();curFly=null;to.style.visibility=""}},520);
}
const setSave=(on,anim)=>{const b=$("#rsave");b.classList.toggle("on",on);b.querySelector("span").textContent=on?"Saved":"Save";if(anim){b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}};
function openReader(id,card){
  const p=POSTS.find(x=>x.id==id); if(!p) return; cur={p,card}; p.read=true; ++tok;
  $("#rtitle").textContent=p.title;
  $("#rdl").innerHTML=[["Source",p.src],["Author","Maya Okonkwo"],["Published",p.ago],["Read time","6 min"]].map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join("");
  $("#rtext").innerHTML=BODY; rpic.className="r-pic"+(p.img?"":" flat"); rpic.style.backgroundImage=p.img?`var(--img-${p.img})`:""; rpic.style.visibility="";
  setSave(!!p.saved,false); R.scrollTop=0; R.classList.remove("closing"); $(".rh").classList.remove("hide"); lt=0;
  R.hidden=false; document.body.style.overflow="hidden";
