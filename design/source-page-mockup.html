<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Source page – feed reader mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
:root{--bg:#EEEAE1;--ink:#141413;--mute:#6B665C;--line:rgba(20,20,19,.16);--card:#D6CFBF;--acc:#E4472B}
@media (prefers-color-scheme:dark){:root{--bg:#10100F;--ink:#F1EDE4;--mute:#9C978B;--line:rgba(241,237,228,.18);--card:#242320}}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:"Archivo","Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit;background:none;border:0}
.app{max-width:430px;min-height:100vh;margin:0 auto;display:flex;flex-direction:column}
main{flex:1}
header{padding:14px 20px;border-bottom:1px solid var(--line);padding-top:calc(14px + env(safe-area-inset-top))}
.back{display:block;width:12px;height:12px;margin:8px 0 8px 6px;border-left:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:rotate(45deg)}
.mast{padding:24px 20px 8px}
.mono{width:56px;height:56px;border-radius:16px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-stretch:125%;font-size:18px}
h1{font-size:40px;line-height:.96;text-transform:uppercase;font-weight:800;font-stretch:112%;letter-spacing:-.02em;margin:20px 0 14px}
.desc{font-size:15px;line-height:1.45;color:var(--mute);max-width:36ch}
.acts{display:flex;gap:8px;margin:22px 0 0}
.pill{border:1px solid var(--ink);border-radius:999px;padding:11px 22px;font-size:14px;font-weight:500}
.pill.solid{background:var(--ink);color:var(--bg)}
.note{font-size:13px;line-height:1.4;color:var(--mute);margin-top:14px;max-width:38ch}
.confirm{margin-top:16px;padding:16px;border:1px solid var(--line);border-radius:18px}
.confirm p{font-size:14px;line-height:1.4}
.confirm div{display:flex;gap:8px;margin-top:14px}
dl{margin:22px 20px 0;border-top:1px solid var(--line)}
dl div{display:grid;grid-template-columns:130px 1fr;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
dt{color:var(--mute)}
dd a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.sec{padding:28px 20px 14px;font-size:13px;color:var(--mute)}
.hero{margin:0 20px 20px}
.pic{position:relative;aspect-ratio:4/5;border-radius:26px;background:var(--card) center/cover no-repeat;overflow:hidden}
.pic.flat{aspect-ratio:1;display:flex;align-items:flex-end;padding:22px}
.pic.flat h2{margin:0 56px 0 0}
.go{position:absolute;right:14px;bottom:14px;width:46px;height:46px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:22px}
h2{font-size:34px;line-height:.98;text-transform:uppercase;font-weight:800;font-stretch:112%;letter-spacing:-.02em;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.hero > h2{margin:18px 0 12px}
.meta{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--mute)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:none}
.row{display:grid;grid-template-columns:1fr 88px;gap:16px;padding:18px 20px;border-top:1px solid var(--line)}
.row.noimg{grid-template-columns:1fr}
.row h3{font-size:18px;line-height:1.14;font-weight:700;letter-spacing:-.01em;margin-top:10px}
.row.read{opacity:.45}
.thumb{width:88px;height:88px;border-radius:14px;background:var(--card) center/cover no-repeat}
.end{padding:22px 20px 36px;border-top:1px solid var(--line);font-size:13px;line-height:1.4;color:var(--mute)}
nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav a{position:relative;padding:16px 0 18px;text-align:center;font-size:13px;color:var(--mute);text-decoration:none}
nav a.on{color:var(--ink);font-weight:500}
nav a.on::before{content:"";position:absolute;top:-1px;left:34%;right:34%;height:2px;background:var(--ink)}
</style>
</head>
<body>
<div class="app">
<header><a class="back" href="#" aria-label="Back"></a></header>
<main>
  <section class="mast">
    <div class="mono">CB</div>
    <h1>Creative Boom</h1>
    <p class="desc">Daily stories on illustration, graphic design, photography and the people making creative work.</p>
    <div class="acts">
      <button class="pill" id="fol">Following</button>
      <button class="pill" id="mute">Mute</button>
    </div>
    <div class="confirm" id="confirm" hidden>
      <p>Unfollow Creative Boom? Articles you saved stay in Saved.</p>
      <div><button class="pill solid" id="yes">Unfollow</button><button class="pill" id="no">Cancel</button></div>
    </div>
    <p class="note" id="note" hidden></p>
  </section>
  <dl id="facts"></dl>
  <p class="sec">Latest from this source</p>
  <article class="hero" id="hero"></article>
  <section id="list"></section>
  <p class="end">That’s everything in this feed. Older articles aren’t available.</p>
</main>
<nav>
  <a href="#">Home</a>
  <a href="#">Saved</a>
  <a href="#" class="on">Sources</a>
</nav>
</div>
<script>
const SOURCE="Creative Boom";
const POSTS=[
  {ago:"1 hr ago",title:"A patchwork bear that’s part toy, part nightmare",img:"bear"},
  {ago:"5 hr ago",title:"Chunky outlines and sticker colours: the new game-character look",img:"dino",read:true},
  {ago:"Yesterday",title:"Ten illustrators redrawing the city map"},
  {ago:"2 days ago",title:"The case for drawing badly on purpose",read:true}
];
const $=s=>document.querySelector(s);
const meta=p=>`<div class="meta">${p.read?"":'<span class="dot"></span>'}<span>${p.ago}</span></div>`;
// Same hero rule as Home: newest article with an image, else the newest as a flat type card.
const hero=POSTS.find(p=>p.img)||POSTS[0], rest=POSTS.filter(p=>p!==hero);
$("#hero").innerHTML=hero.img
  ?`<div class="pic" style="background-image:var(--img-${hero.img})"><span class="go">↗</span></div><h2>${hero.title}</h2>${meta(hero)}`
  :`<div class="pic flat"><h2>${hero.title}</h2><span class="go">↗</span></div>${meta(hero)}`;
$("#list").innerHTML=rest.map(p=>`<article class="row${p.img?"":" noimg"}${p.read?" read":""}"><div>${meta(p)}<h3>${p.title}</h3></div>${p.img?`<div class="thumb" style="background-image:var(--img-${p.img})"></div>`:""}</article>`).join("");
$("#facts").innerHTML=[["In this feed",POSTS.length+" articles"],["Unread",POSTS.filter(p=>!p.read).length],["Latest",POSTS[0].ago],["Website",'<a href="#">creativeboom.com ↗</a>']].map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join("");

let following=true, muted=false;
function sync(){
  $("#fol").textContent=following?"Following":"Follow";
  $("#fol").classList.toggle("solid",!following);
  $("#mute").textContent=muted?"Muted":"Mute";
  $("#mute").classList.toggle("solid",muted);
  const n=$("#note");
  n.hidden=following&&!muted;
  n.textContent=!following?"You’re not following Creative Boom. New articles won’t appear on Home.":"Muted. New articles from this source won’t appear on Home.";
}
$("#fol").onclick=()=>{if(following){$("#confirm").hidden=false}else{following=true;sync()}};
$("#yes").onclick=()=>{following=false;$("#confirm").hidden=true;sync()};
$("#no").onclick=()=>{$("#confirm").hidden=true};
$("#mute").onclick=()=>{muted=!muted;sync()};
sync();
</script>

<style id="motion">
/* MOTION TOKENS
   press .18s spring | content enter .35s ease-out, 40ms stagger | pop .4s spring | unfold .35s ease-out
   switches and sliding pills .3s | reduced motion: all off */
:root{--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{-webkit-tap-highlight-color:transparent}
button,.pill,.chip{transition:transform .18s var(--spring),background-color .2s,color .2s,border-color .2s,opacity .2s}
button:not(:disabled):active,a.pill:active{transform:scale(.96)}
.row:active,.src:active,.set.link:active{transform:scale(.985)}
.row,.src,.set.link{transition:transform .18s var(--spring),opacity .35s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{0%{transform:scale(.6)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes unfold{from{opacity:0;transform:translateY(-8px) scale(.97)}}
@keyframes titleUp{from{opacity:0;transform:translateY(40px)}}
.in{animation:rise .35s var(--ease) backwards;animation-delay:calc(var(--i,0)*40ms)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

.confirm:not([hidden]){animation:unfold .3s var(--ease)}
.note:not([hidden]){animation:rise .3s var(--ease)}
.pill{transition:transform .18s var(--spring),background-color .25s,color .25s}
</style>
<script id="motion-js">
const tick=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};
function stag(sel){document.querySelectorAll(sel).forEach((e,i)=>{e.style.setProperty("--i",Math.min(i,10));e.classList.remove("in");void e.offsetWidth;e.classList.add("in")})}

stag(".mono,.mast h1,.desc,.acts,#facts div,.sec,.hero,.row");
document.querySelectorAll("#fol,#mute,#yes").forEach(b=>b.addEventListener("click",tick));
</script>
