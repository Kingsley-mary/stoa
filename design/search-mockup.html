<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Search – feed reader mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
:root{--bg:#EEEAE1;--ink:#141413;--mute:#6B665C;--line:rgba(20,20,19,.16);--card:#D6CFBF;--acc:#E4472B}
@media (prefers-color-scheme:dark){:root{--bg:#10100F;--ink:#F1EDE4;--mute:#9C978B;--line:rgba(241,237,228,.18);--card:#242320}}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:"Archivo","Helvetica Neue",Arial,sans-serif}
.app{max-width:430px;min-height:100vh;margin:0 auto;padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;background:none;border:0}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.back{flex:none;width:12px;height:12px;border-left:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:rotate(45deg);margin:0 8px 0 6px}
#q{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);font:inherit;font-size:22px;font-weight:700;letter-spacing:-.01em;caret-color:var(--ink)}
#q::placeholder{color:var(--mute);font-weight:500}
#clear{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--ink);font-size:16px;line-height:1}
.sec{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 8px;font-size:13px;color:var(--mute)}
.sec button{font-size:13px;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.rec{display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line)}
.rec .go-q{flex:1;text-align:left;padding:16px 0;font-size:18px;font-weight:500}
.rec .x{width:36px;height:36px;font-size:20px;color:var(--mute)}
.count{padding:18px 20px 14px;font-size:13px;color:var(--mute)}
.row{display:grid;grid-template-columns:1fr 88px;gap:16px;padding:18px 20px;border-top:1px solid var(--line)}
.row.noimg{grid-template-columns:1fr}
.row h3{font-size:18px;line-height:1.14;font-weight:700;letter-spacing:-.01em;margin-top:10px}
.row p{font-size:14px;line-height:1.35;color:var(--mute);margin-top:8px}
.row.read{opacity:.45}
.thumb{width:88px;height:88px;border-radius:14px;background:var(--card) center/cover no-repeat}
.meta{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--mute)}
.meta b{font-weight:500;color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:none}
mark{background:none;color:inherit;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.empty{padding:48px 20px}
.empty h3{font-size:26px;line-height:1.02;font-weight:800;font-stretch:112%;letter-spacing:-.02em;text-transform:uppercase}
.empty p{margin-top:14px;font-size:15px;line-height:1.4;color:var(--mute);max-width:32ch}
</style>
</head>
<body>
<div class="app">
<header>
  <a class="back" href="#" aria-label="Back"></a>
  <input id="q" type="text" placeholder="Search articles" autocomplete="off" enterkeyhint="search" autofocus>
  <button id="clear" aria-label="Clear search" hidden>×</button>
</header>
<main id="body"></main>
</div>
<script>
const POSTS=[
  {src:"Creative Review",ago:"12 min ago",title:"The photographers who shoot only in natural light",ex:"Soft shadows, long exposures and no studio strobes.",img:"water"},
  {src:"WALLPAPER*",ago:"38 min ago",title:"Fangs, gloss and the new gothic beauty",ex:"Beauty editors are pairing dark lips with sharp, playful details.",img:"fang"},
  {src:"Creative Boom",ago:"1 hr ago",title:"A patchwork bear that’s part toy, part nightmare",ex:"An illustrator stitches horror and comfort into one character.",img:"bear"},
  {src:"Dezeen",ago:"2 hr ago",title:"A timber pavilion designed to be taken apart",ex:"The structure packs flat and rebuilds in a day."},
  {src:"Creative Review",ago:"3 hr ago",title:"Why every rebrand now ships with a custom typeface",ex:"Studios are drawing bespoke letters for even small brands."},
  {src:"WIRED",ago:"4 hr ago",title:"Why every new app is quietly copying the same layout",ex:"Designers say the grid is winning because it is cheap to build."},
  {src:"Creative Boom",ago:"5 hr ago",title:"Chunky outlines and sticker colours: the new game-character look",ex:"Bold shapes read well at thumbnail size.",img:"dino",read:true},
  {src:"WIRED",ago:"Yesterday",title:"The indie game that turned a pumpkin into a hero",ex:"A one-person studio on lanterns, graveyards and low budgets.",img:"pumpkin",read:true}
];
let recent=["typeface","bear","natural light"];
const $=s=>document.querySelector(s), q=$("#q");
const h=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const esc=s=>s.replace(/[.*+?^$|(){}\[\]\\]/g,"\\$&");
const words=v=>v.trim().toLowerCase().split(/\s+/).filter(Boolean);
const hl=(t,ws)=>t.replace(new RegExp("("+ws.map(esc).join("|")+")","gi"),"<mark>$1</mark>");

function render(){
  const v=q.value, ws=words(v);
  $("#clear").hidden=!v;
  if(!ws.length){
    $("#body").innerHTML=recent.length
      ?`<div class="sec"><span>Recent searches</span><button data-clear>Clear all</button></div>`+recent.map(r=>`<div class="rec"><button class="go-q" data-q="${h(r)}">${h(r)}</button><button class="x" data-x="${h(r)}" aria-label="Remove ${h(r)}">×</button></div>`).join("")
      :`<div class="empty"><p>Searches you make will show up here.</p></div>`;
    return;
  }
  // Searches title, excerpt and source name. Every word must match.
  const hits=POSTS.filter(p=>{const hay=(p.title+" "+p.ex+" "+p.src).toLowerCase();return ws.every(w=>hay.includes(w))});
  if(!hits.length){
    $("#body").innerHTML=`<div class="empty"><h3>No articles match “${h(v.trim())}”</h3><p>Search covers recent articles from your sources. Try a shorter word or check the spelling.</p></div>`;
    return;
  }
  $("#body").innerHTML=`<p class="count">${hits.length} ${hits.length===1?"result":"results"} for “${h(v.trim())}”</p>`+hits.map(p=>`<article class="row${p.img?"":" noimg"}${p.read?" read":""}"><div><div class="meta">${p.read?"":'<span class="dot"></span>'}<b>${p.src}</b><span>${p.ago}</span></div><h3>${hl(p.title,ws)}</h3><p>${hl(p.ex,ws)}</p></div>${p.img?`<div class="thumb" style="background-image:var(--img-${p.img})"></div>`:""}</article>`).join("");
}
q.addEventListener("input",render);
q.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&q.value.trim()){recent=[q.value.trim(),...recent.filter(r=>r!==q.value.trim())].slice(0,6);q.blur()}
});
$("#clear").addEventListener("click",()=>{q.value="";render();q.focus()});
$("#body").addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.q){q.value=t.dataset.q;render()}
  else if(t.dataset.x){recent=recent.filter(r=>r!==t.dataset.x);render()}
  else if("clear" in t.dataset){recent=[];render()}
});
render();
</script>

<style id="motion">
/* MOTION TOKENS
   press .18s spring | content enter .35s ease-out, 40ms stagger | pop .4s spring | unfold .35s ease-out
   switches and sliding pills .3s | reduced motion: all off */
:root{--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{-webkit-tap-highlight-color:transparent}
button,.pill,.chip{transition:transform .18s var(--spring),background-color .2s,color .2s,border-color .2s,opacity .2s}
button:not(:disabled):active,a.pill:active{transform:scale(.96)}
.row:active,.src:active,.set.link:active{transform:scale(.985)}
.row,.src,.set.link{transition:transform .18s var(--spring),opacity .35s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{0%{transform:scale(.6)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes unfold{from{opacity:0;transform:translateY(-8px) scale(.97)}}
@keyframes titleUp{from{opacity:0;transform:translateY(40px)}}
.in{animation:rise .35s var(--ease) backwards;animation-delay:calc(var(--i,0)*40ms)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

#clear:not([hidden]){animation:pop .3s var(--spring)}
.rec{overflow:hidden;max-height:70px;transition:max-height .22s var(--ease),opacity .2s}
.rec.gone{max-height:0;opacity:0}
.rec .go-q:active{transform:none;opacity:.6}
.found,.msg{animation:unfold .3s var(--ease)}
</style>
<script id="motion-js">
const tick=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};
function stag(sel){document.querySelectorAll(sel).forEach((e,i)=>{e.style.setProperty("--i",Math.min(i,10));e.classList.remove("in");void e.offsetWidth;e.classList.add("in")})}

// Stagger in only when the view changes (recent, results, none), not on every keystroke.
const bodyEl=document.getElementById("body");let lastKey="";
function run(){const key=bodyEl.querySelector(".count")?"res":bodyEl.querySelector(".rec")?"rec":"none";if(key!==lastKey){lastKey=key;stag("#body .row,#body .rec,#body .empty")}}
new MutationObserver(run).observe(bodyEl,{childList:true});run();
// Removing a recent search: collapse the row first, then remove it.
bodyEl.addEventListener("click",e=>{const x=e.target.closest(".x");if(!x||x.dataset.go)return;e.stopPropagation();x.dataset.go=1;x.closest(".rec").classList.add("gone");setTimeout(()=>x.click(),220)},true);
</script>
</body>
